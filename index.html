<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LogoWriter GL 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* The page only frames the screensaver: everything inside #app is styled by the module (scoped under .lw3d). */
html,body{height:100%;margin:0;overflow:hidden;background:#05060c;color:#8d93b3;color-scheme:dark}
#app{position:fixed;inset:0}
.fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:13px/1.45 'IBM Plex Mono',ui-monospace,monospace}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {mount,LOOKS,CAMS} from './logowriter3d.js';

// Look/camera persist across visits. Older versions stored an index (-1 = auto); map those to ids.
const store={get(k,d){try{const v=localStorage.getItem('lw3d.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('lw3d.'+k,JSON.stringify(v))}catch{}}};
const fromSaved=(v,list,auto)=>typeof v==='number'?(list[v]?.id??auto):list.some(x=>x.id===v)?v:auto;
const camIds=CAMS.filter(c=>c.id!=='auto');

// Fullscreen and the screen wake lock belong to the page, not the module.
let wakeLock=null;
async function toggleFull(){
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}
  try{if(navigator.wakeLock&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeLock=null});

try{
  window.lw3d=mount(document.getElementById('app'),{
    hud:true,keys:true,editor:true,maxSegments:2_000_000,
    look:fromSaved(store.get('look',-1),LOOKS,'random'),
    cam:fromSaved(store.get('cam',-1),camIds,'auto'),
    onFullscreen:toggleFull,
    onChange:({look,cam})=>{store.set('look',look);store.set('cam',cam)},
  });
}catch(e){
  console.error(e);
  const d=document.createElement('div');d.className='fail';
  d.textContent=e.code==='no-webgl2'?'This screensaver needs WebGL 2. Try a current version of Chrome, Firefox, Safari or Edge.':'The screensaver could not start: '+e.message;
  document.body.append(d);
}
</script>
</body>
</html>
